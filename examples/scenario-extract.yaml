# A scenario whose step uses what an earlier reply held: extract names a field of the
# reply, and a later step reads it as {{extract.<name>}}. If a reply lacks the field,
# that step is counted as bad_response and the iteration stops there. Runs against the
# reference stand (`make stand`):
#   leettest -c examples/scenario-extract.yaml

app:
  target:
    ip: 127.0.0.1
    port: 50051
  tls: false

load:
  calls:
    - method: wallet.v1.WalletService/GetBalance
      rps: 50
      duration: 1m
      templates: true
      data:
        wallet_id: "wallet-{{seq}}"
      # name: path in the reply, fields joined by dots (balance.amount for a field of a
      # message). The path is checked against the method's schema before the load.
      extract:
        wallet: wallet_id
        funds: amount
      scenario: pay-and-check
      steps:
        - method: wallet.v1.WalletService/Transfer
          timeout: 500ms
          templates: true
          # A step extracts as the call does; a name is taken once in a scenario.
          extract:
            tx: id
          data:
            # A string takes the value among other text; a number takes a whole
            # {{extract.<name>}} of an integer that fits it (int64 into int64 here).
            from: "{{extract.wallet}}"
            to: "{{uuid}}"
            amount: "{{extract.funds}}"
        # The stand has no method to read a transfer back, so the last step asks the
        # health service about the transfer id: a string field takes it as any text.
        - method: grpc.health.v1.Health/Check
          templates: true
          data:
            service: "{{extract.tx}}"
