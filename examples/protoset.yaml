# A service without server reflection: the methods come from a protoset, against the reference
# stand, from the repository root:
#   go run ./test/stand/cmd/stand -no-reflection -delay 20ms -life 60s
#   leettest -c examples/protoset.yaml
# The set is made with imports included:
#   protoc -I test/stand/proto --include_imports --descriptor_set_out=examples/wallet.protoset test/stand/proto/wallet/v1/wallet.proto
# Files instead of a set: proto.yaml.

app:
  target:
    ip: 127.0.0.1
    port: 50051
  tls: false
  protoset: wallet.protoset         # a FileDescriptorSet with the imports included; relative to this file

load:
  calls:
    - method: wallet.v1.WalletService/GetBalance
      rps: 50
      duration: 10s
      data:                         # the request body, checked against the set before the run
        wallet_id: w-42
