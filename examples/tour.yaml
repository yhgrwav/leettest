# Every field LeetTest reads, against the reference stand, from the repository root:
#   go run ./test/stand/cmd/stand -delay 20ms -hang-from 25s -life 60s
#   export LEETTEST_TOKEN=demo
#   leettest -c examples/tour.yaml
# TLS and mTLS: tour-tls.yaml. The quickstart walks through it: docs/en/quickstart.md.

name: tour                          # the run's name in the header

app:
  target:
    ip: 127.0.0.1
    port: 50051
  tls: false                        # on by default; the stand speaks plaintext unless started with -tls
  metadata:                         # sent with every call; ${NAME} comes from the environment
    authorization: Bearer ${LEETTEST_TOKEN}  # export LEETTEST_TOKEN=demo — the shared token we give the first users
    x-request-source: leettest-tour
  max_response_size: 1MiB           # a bigger reply is a bad response, not a success
  connections: 1                    # N connections, calls take them in turn; the default is 1
  # compression: gzip               # compress request bodies; left out - none (the target must accept gzip)

load:
  warmup: 3s                        # sent, but kept out of the percentiles
  calls:                            # one call per method, each with its own rps
    - method: grpc.health.v1.Health/Check
      rps: 300
      duration: 40s
      timeout: 500ms                # a call with no answer by then timed out
      data:                         # the request body as YAML; the schema comes from reflection
        service: wallet.v1.WalletService
    - method: wallet.v1.WalletService/GetBalance
      rps: 50
      duration: 40s
      timeout: 500ms
      dataset: wallets.jsonl        # a different request each call: one JSON per line, in order, then again
      dataset_order: random         # file (default) or random: a new permutation of the file on each pass
      dataset_seed: 42              # random only; left out, a seed is drawn and the report prints it
      dataset_reuse: true           # false: each record at most once; a run the file cannot cover is refused
