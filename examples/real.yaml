# A run against a real system: app.mode: real asks for a ramp, so the first
# second is never the full load. Without load.ramp the config is refused before any call. The
# report prints the mode under the name. The run prints its plan and asks "Start? [y/N]" on a
# terminal; off a terminal (CI, a script) it needs -yes. Against the reference stand, from the
# repository root:
#   go run ./test/stand/cmd/stand -delay 20ms
#   leettest -c examples/real.yaml

app:
  target:
    ip: 127.0.0.1
    port: 50051
  tls: false
  mode: real

load:
  ramp: 30s
  # The run is stopped when a method's failures pass this share of its calls
  # over the last 5 seconds (and are at least 2); real asks for it.
  stop_on_errors: 5%
  warmup: 5s
  calls:
    - method: wallet.v1.WalletService/GetBalance
      rps: 800
      duration: 1m
