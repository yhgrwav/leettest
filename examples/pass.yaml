# Pass limits on a healthy run of the reference stand, from the repository root:
#   go run ./test/stand/cmd/stand -delay 20ms
#   leettest -c examples/pass.yaml
# The stand answers in 20ms, so every limit holds and the exit code is 0. A missed limit ends the
# run with exit code 4, a limit that cannot be decided with 2. The limits of a search are in
# breakpoint.yaml.

app:
  target:
    ip: 127.0.0.1
    port: 50051
  tls: false

load:
  warmup: 5s
  calls:
    - method: wallet.v1.WalletService/GetBalance
      rps: 800
      duration: 1m
      pass:
        p50: 50ms
        p90: 80ms
        p95: 100ms
        p99: 200ms
        p999: 500ms                 # needs 1000 calls measured: 800 rps for a minute is plenty
        errors: 1%                  # failed calls of all counted; the latency limits need it next to them

    - method: wallet.v1.WalletService/Transfer
      rps: 50
      duration: 1m
      pass:
        p99: 200ms
        errors: 0.5%
