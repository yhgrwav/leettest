# Сценарий: одна итерация — проверка баланса и затем перевод. rps считает итерации;
# шаг уходит, когда закончился предыдущий, а шаг, который не удался, заканчивает свою
# итерацию. После таблицы методов отчёт печатает блок на каждый сценарий. На эталонном
# стенде, из корня репозитория:
#   go run ./test/stand/cmd/stand -delay 20ms
#   leettest -c examples/ru/scenario.yaml

app:
  target:
    ip: 127.0.0.1
    port: 50051
  tls: false

load:
  calls:
    - method: wallet.v1.WalletService/GetBalance
      rps: 50
      duration: 1m
      # {{seq}} — номер итерации: проверка баланса и перевод одной итерации несут один и
      # тот же, то есть говорят об одном кошельке.
      templates: true
      data:
        wallet_id: "wallet-{{seq}}"
      scenario: pay-and-check
      steps:
        - method: wallet.v1.WalletService/Transfer
          timeout: 500ms
          # Шаблоны шага включаются на самом шаге и требуют templates: true у вызова.
          templates: true
          # Своё тело запроса шага: проверяется по методу шага до нагрузки.
          data:
            from: "wallet-{{seq}}"
            to: "{{uuid}}"
            amount: 100
