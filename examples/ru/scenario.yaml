# Сценарий: одна итерация — проверка баланса, затем перевод и чтение истории. rps
# считает итерации; шаг уходит, когда закончился предыдущий, а шаг, который не удался,
# заканчивает свою итерацию. После таблицы методов отчёт печатает блок на каждый
# сценарий. На эталонном стенде, из корня репозитория:
#   go run ./test/stand/cmd/stand -delay 20ms
#   leettest -c examples/ru/scenario.yaml

app:
  target:
    ip: 127.0.0.1
    port: 50051
  tls: false

load:
  calls:
    - method: wallet.v1.WalletService/GetBalance
      rps: 50
      duration: 1m
      scenario: pay-and-check
      steps:
        - method: wallet.v1.WalletService/Transfer
          timeout: 500ms
        - method: wallet.v1.WalletService/GetHistory
