# Тот же поиск с абсолютным шагом, из корня репозитория:
#   go run ./test/stand/cmd/stand -capacity 270 -delay 20ms
#   leettest -c examples/ru/breakpoint-step.yaml

app:
  target:
    ip: 127.0.0.1
    port: 50051
  tls: false

load:
  calls:
    - method: grpc.health.v1.Health/Check
      timeout: 500ms
  breakpoint:
    from: 100
    to: 400
    step: 50                        # каждая ступень на 50 rps выше прошлой, вместо factor
    settle: 2s
    hold: 10s
