# Разгон (не выпущено): каждый вызов поднимается с 0 до своего rps за 30s, затем держит его
# свой duration. Прогон идёт 30s + 1m. Разгон и прогрев не попадают в статистику; отчёт
# печатает их одной строкой. На эталонном стенде, из корня репозитория:
#   go run ./test/stand/cmd/stand -delay 20ms
#   leettest -c examples/ru/ramp.yaml

app:
  target:
    ip: 127.0.0.1
    port: 50051
  tls: false

load:
  ramp: 30s
  warmup: 5s
  calls:
    - method: wallet.v1.WalletService/GetBalance
      rps: 800
      duration: 1m
