app:
  target:
    ip: localhost
    port: 50051
  tls: false
  connections: 1 # нет в v0.1.0; больше одного нагружает несколько бэкендов за именем

load:
  warmup: 5s
  calls:
    - method: wallet.v1.WalletService/GetBalance
      rps: 800
      duration: 1m

    - method: wallet.v1.WalletService/Transfer
      rps: 50
      duration: 1m
