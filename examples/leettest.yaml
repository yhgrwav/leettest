app:
  target:
    ip: localhost
    port: 50051
  tls: false
  connections: 1 # not in v0.1.0; more than one loads several backends behind a name

load:
  warmup: 5s
  calls:
    - method: wallet.v1.WalletService/GetBalance
      rps: 800
      duration: 1m

    - method: wallet.v1.WalletService/Transfer
      rps: 50
      duration: 1m
