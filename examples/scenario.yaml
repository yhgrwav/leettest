# A scenario: one iteration is a balance check followed by a transfer. rps counts
# iterations; a step goes out when the one before it ends, and a step that fails ends
# its iteration. The report prints a block per scenario after the method table. Against
# the reference stand, from the repository root:
#   go run ./test/stand/cmd/stand -delay 20ms
#   leettest -c examples/scenario.yaml

app:
  target:
    ip: 127.0.0.1
    port: 50051
  tls: false

load:
  calls:
    - method: wallet.v1.WalletService/GetBalance
      rps: 50
      duration: 1m
      # {{seq}} is the number of the iteration: the balance check and the transfer
      # of one iteration carry the same one, so they speak of the same wallet.
      templates: true
      data:
        wallet_id: "wallet-{{seq}}"
      scenario: pay-and-check
      steps:
        - method: wallet.v1.WalletService/Transfer
          timeout: 500ms
          # The step's templates are its own switch, and need templates: true on the call.
          templates: true
          # The step's own request body, checked against its method before the load.
          data:
            from: "wallet-{{seq}}"
            to: "{{uuid}}"
            amount: 100
