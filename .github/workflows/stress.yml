name: Stress

# Every test many times under -race, four times a day: a flaky test passes a
# PR's single run and fails one run in fifty. A failure opens an issue, or
# comments on the open one, so it does not rest in a mail to whoever last
# touched the cron. GitHub disables a scheduled workflow after 60 days without
# commits to a public repo; re-enable it under Actions after a quiet spell.
#
# The schedule runs on the default branch only, so this file reads the list of
# branches in .github/stress-branches and checks each one out at its own tip,
# with the Go versions of its own ci.yml and release.yml. The rules live in
# test/stressplan.
on:
  schedule:
    # Off the hour: GitHub delays runs due at :00 the most.
    - cron: "13 1,7,13,19 * * *"
  workflow_dispatch:

# A run delayed by hours must not share the CPU with the next one.
concurrency:
  group: stress
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: plan
        run: |
          git fetch --quiet origin
          go run ./test/stressplan/cmd/stressplan plan .github/stress-branches > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  stress:
    # The name carries the branch, its commit and the Go version:
    # stressplan.ParseJobName reads them back for the count.
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: name the job in the summary
        env:
          JOB: ${{ matrix.name }}
        run: echo "$JOB" >> "$GITHUB_STEP_SUMMARY"
      # 20 runs of the slowest package took ~23 min in Docker on 2 CPUs; the
      # default 10 min per test binary would cut it short.
      - run: make stress 2>&1 | tee stress.log
        shell: bash -o pipefail {0}
      - name: keep the failures
        if: failure()
        run: |
          grep -E -- '--- FAIL|_test.go:[0-9]+:|panic:|WARNING: DATA RACE' stress.log | head -100 > failures.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: stress-${{ strategy.job-index }}
          path: failures.txt
      # The job says for itself how it ended; the report reads these files, not
      # the jobs API, which may not have recorded the last jobs' results yet.
      - name: write the job's result
        if: always()
        env:
          JOB: ${{ matrix.name }}
          STATUS: ${{ job.status }}
        run: printf '%s\t%s\n' "$JOB" "$STATUS" > "result-${{ strategy.job-index }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-${{ strategy.job-index }}
          path: result-${{ strategy.job-index }}.txt
          retention-days: 1

  report:
    name: report a failure
    runs-on: ubuntu-latest
    needs: [plan, stress]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # Nothing to download when no stress job started (the plan failed).
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: results
      # One issue per red branch: another branch's red job does not blame it. A
      # planned job that wrote no result is red.
      - name: open or update the issue of each red branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          mkdir -p results
          printf '%s\n' "$MATRIX" > plan.json
          file_issue() {
            open=$(gh issue list --state open --search "\"$1\" in:title" --json number --jq '.[0].number')
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$2"
            else
              gh issue create --title "$1" --body "$2"
            fi
          }
          # The list could not be read, so no branch can be judged: say so on
          # main's issue before the step fails, or the run goes quiet.
          if ! go run ./test/stressplan/cmd/stressplan verdicts .github/stress-branches plan.json results > verdicts.txt; then
            title=$(go run ./test/stressplan/cmd/stressplan title main || echo "Stress run failed on main")
            file_issue "$title" "Run: $RUN. The stress run could not plan or judge its branches; see the plan and report logs."
            exit 1
          fi
          cat verdicts.txt
          while read -r branch verdict <&3; do
            [ "$verdict" = red ] || continue
            title=$(go run ./test/stressplan/cmd/stressplan title "$branch")
            red=$(cat results/*.txt 2>/dev/null | grep "^stress $branch@" | grep -v "$(printf '\tsuccess$')" | cut -f1 | paste -sd, - || true)
            file_issue "$title" "Run: $RUN. Red: ${red:-a job of this branch wrote no result}. The failing tests are in the run's artifacts."
          done 3< verdicts.txt
