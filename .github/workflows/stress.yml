name: Stress

# Every test many times under -race, four times a day: a flaky test passes a
# PR's single run and fails one run in fifty. A failure opens an issue, or
# comments on the open one, so it does not rest in a mail to whoever last
# touched the cron. GitHub disables a scheduled workflow after 60 days without
# commits to a public repo; re-enable it under Actions after a quiet spell.
#
# The schedule runs on the default branch only, so this file reads the list of
# branches in .github/stress-branches and checks each one out at its own tip,
# with the Go versions of its own ci.yml and release.yml. The rules live in
# test/stressplan.
on:
  schedule:
    # Off the hour: GitHub delays runs due at :00 the most.
    - cron: "13 1,7,13,19 * * *"
  workflow_dispatch:

# A run delayed by hours must not share the CPU with the next one.
concurrency:
  group: stress
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: plan
        run: |
          git fetch --quiet origin
          go run ./test/stressplan/cmd/stressplan plan .github/stress-branches > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  stress:
    # The name carries the branch, its commit and the Go version:
    # stressplan.ParseJobName reads them back for the count.
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: name the job in the summary
        env:
          JOB: ${{ matrix.name }}
        run: echo "$JOB" >> "$GITHUB_STEP_SUMMARY"
      # 20 runs of the slowest package took ~23 min in Docker on 2 CPUs; the
      # default 10 min per test binary would cut it short.
      - run: make stress 2>&1 | tee stress.log
        shell: bash -o pipefail {0}
      - name: keep the failures
        if: failure()
        run: |
          grep -E -- '--- FAIL|_test.go:[0-9]+:|panic:|WARNING: DATA RACE' stress.log | head -100 > failures.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: stress-${{ strategy.job-index }}
          path: failures.txt

  report:
    name: report a failure
    runs-on: ubuntu-latest
    needs: [plan, stress]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # One issue per red branch: another branch's red job does not blame it.
      - name: open or update the issue of each red branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs" --paginate > jobs.json
          go run ./test/stressplan/cmd/stressplan verdicts .github/stress-branches jobs.json > verdicts.txt
          cat verdicts.txt
          while read -r branch verdict <&3; do
            [ "$verdict" = red ] || continue
            title=$(go run ./test/stressplan/cmd/stressplan title "$branch")
            red=$(jq -rs --arg b "$branch" '[.[].jobs[] | select((.name | startswith("stress " + $b + "@")) and .conclusion != "success") | .name] | join(", ")' jobs.json)
            body="Run: $RUN. Red: ${red:-no stress job ran for this branch}. The failing tests are in the run's artifacts."
            open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done 3< verdicts.txt
