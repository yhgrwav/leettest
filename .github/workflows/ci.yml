name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_LATEST: "1.27.1"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the version declared in go.mod: if it stops
        # compiling there, the module's compatibility claim is wrong.
        go: ["1.26", "1.27.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: make vet race build

  # A stable name for branch protection: the matrix job names carry a Go version
  # and would have to be re-registered on every bump.
  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Fail unless every matrix job passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "matrix result: ${{ needs.test.result }}"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - run: go install github.com/google/go-licenses@v1.6.0
      - name: Check licenses
        run: |
          go-licenses check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC

  # The quickstart's config must keep working: run it against the reference
  # stand, as the quickstart does. A real target, not -fake: -fake checks
  # neither ${ENV} in metadata nor the request body against reflection.
  tour:
    name: quickstart tour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - run: go build -o bin/ ./cmd/leettest ./test/stand/cmd/stand
      - name: Run examples/tour.yaml
        env:
          LEETTEST_TOKEN: ci
        run: |
          bin/stand -delay 20ms -hang-from 25s -life 60s &
          sleep 1
          rc=0
          bin/leettest -c examples/tour.yaml -output json > tour.json || rc=$?
          # The runner is native Linux: its start lag and clock are the
          # reference for the run-side verdicts.
          if [ -s tour.json ]; then
            jq -c '{exit: '"$rc"', start_lag, clock_step_ns, invalid_reasons, tail_wait_cause,
              not_sent, not_sent_generator, not_sent_connection, not_sent_stream,
              generator_tail_calls: .client_waits.generator_tail_calls,
              p99_us: .methods[0].latency.p99.us,
              p99_without_client_waits_us: .methods[0].p99_without_client_waits.us}' tour.json
          fi
          if [ "$rc" -ne 0 ]; then
            echo "exit code $rc"
            exit 1
          fi
          # (300 + 50) rps for 40s, the 3s warm-up counted apart.
          jq -e '.sent == 12950 and [.methods[].sent] == [11100, 1850]' tour.json
          # The exact schedule (#142): the plain Go timer starts calls up to
          # 1ms late (p99 ~1.08ms on this runner); the exact one measured
          # 144µs in this tour. The bound is half the timer's lateness.
          lag=$(jq '.start_lag.p99.us' tour.json)
          if [ "$lag" -ge 500 ]; then
            echo "::error::start lag p99 ${lag}us, want under 500us: the schedule is not exact"
            exit 1
          fi
      # Each example uses port 50051: the previous step's stand outlives its
      # run by its -life, so it is stopped first.
      - name: Run examples/tour-tls.yaml
        run: |
          pkill -x stand || true
          while pgrep -x stand > /dev/null; do sleep 0.2; done
          bin/stand -mtls -delay 20ms -life 30s &
          sleep 1
          bin/leettest -c examples/tour-tls.yaml -output json > tour-tls.json
          jq -e '.sent == 2000' tour-tls.json
          # gzip on: the stand accepted it and the sizes are told.
          jq -e '.settings.compression == "gzip" and ([.methods[] | .request_bytes.wire > 0] | all) and ([.methods[] | .request_error.count == 0] | all)' tour-tls.json
      - name: Run examples/leettest.yaml
        run: |
          pkill -x stand || true
          while pgrep -x stand > /dev/null; do sleep 0.2; done
          bin/stand -delay 20ms -life 75s &
          sleep 1
          bin/leettest -c examples/leettest.yaml -output json > leettest.json
          # (800 + 50) rps for 1m, the 5s warm-up counted apart.
          jq -e '.sent == 46750' leettest.json
      - name: Run examples/pass.yaml
        run: |
          pkill -x stand || true
          while pgrep -x stand > /dev/null; do sleep 0.2; done
          bin/stand -delay 20ms -life 75s &
          sleep 1
          # A healthy stand: every limit holds, so the exit code is 0 (a miss is 4).
          bin/leettest -c examples/pass.yaml -output json > pass.json
          jq -e '(.thresholds | length) == 8 and all(.thresholds[]; .verdict == "pass")' pass.json

  # The stand's Go code is generated from wallet.proto with pinned tools:
  # regenerating must change nothing.
  proto:
    name: generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - run: sh test/stand/proto/gen.sh
      - run: git diff --exit-code

  # The release runs only on a tag; building it here keeps a broken
  # .goreleaser.yaml from surfacing first at release time.
  release-build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_LATEST }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.2"
          args: release --snapshot --clean
      # The same build and check as release.yml, on every PR: a step that only
      # runs on a tag is first tried on the release. The snapshot's tag
      # (v0.0.0 before any tag) stands in for GITHUB_REF_NAME.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.2"
          args: build --snapshot --single-target --clean --output dist/leettest-check
      - name: version matches the tag
        run: |
          got=$(dist/leettest-check -version)
          want="leettest $(jq -r .tag dist/metadata.json)"
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::-version printed '$got', want '$want'"; exit 1; }

  # install.sh is what the README tells users to pipe into sh: run it as they do, on both
  # platforms it supports. The cases against real releases need GitHub; the rest use a local
  # fixture.
  install-script:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh test/install/test.sh
      - run: sh test/install/test.sh
        env:
          GH_TOKEN: ${{ github.token }}
