name: Release

on:
  push:
    # Strict: a tag like vtest must not publish a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Go that CI tests as latest (GO_LATEST in ci.yml; the weekly
          # tool-versions check keeps them equal). go-version-file would take
          # go.mod's floor, 1.26.0, without later stdlib security fixes.
          go-version: "1.27.1"
          # This job can write: a cache other workflows wrote does not get in.
          cache: false
      # Only the tip of release/vX.Y gets vX.Y.Z[-rc.N]: that is the commit
      # the stress count and the rehearsal ran on. Outside the work tree, so
      # goreleaser still sees a clean one.
      - name: the tag is the tip of its release branch
        run: |
          git fetch --quiet origin
          git branch -r --points-at "$GITHUB_SHA" > "$RUNNER_TEMP/pointsat.txt"
          go run ./test/stressplan/cmd/stressplan tag "$GITHUB_REF_NAME" "$RUNNER_TEMP/pointsat.txt"
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.18.2"
          # --clean empties dist and nothing makes a subdirectory in it:
          # dist/check/leettest fails to copy. The file stays inside dist so
          # the tree is clean for the release step.
          args: build --single-target --clean --output dist/leettest-check
      # Nothing is published unless the binary names the tag it was built for.
      - name: version matches the tag
        run: |
          got=$(dist/leettest-check -version)
          want="leettest ${GITHUB_REF_NAME}"
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::-version printed '$got', want '$want'"; exit 1; }
      # The release page shows what the version can do, written for users, not
      # a list of commits; an rc uses its version's notes.
      - name: release notes exist
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME%%-*}.md"
          [ -s "$notes" ] || { echo "::error::no $notes: write the release notes first"; exit 1; }
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.18.2"
          args: release --clean --release-notes ${{ env.NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
