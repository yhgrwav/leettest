name: Branch cleanup

# A merged pull request's branch is deleted by GitHub (delete_branch_on_merge).
# This removes what that leaves: the branch of a pull request closed without a
# merge, a week after the close, so it can still be reopened meanwhile. A
# branch with no pull request is someone's work in progress: it is named in
# the run's summary, never deleted. Long-lived branches are skipped, and the
# ruleset forbids deleting them anyway.
on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches of pull requests closed without a merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          week_ago=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # NONE: no pull request of this repository; KEEP: one is open or
          # merged; CLOSED <when>: all closed without a merge, the last at <when>.
          verdict='[.[] | select(.isCrossRepository | not)] as $own
            | if ($own | length) == 0 then "NONE"
              elif ($own | all(.state == "CLOSED")) then "CLOSED \($own | map(.closedAt) | max)"
              else "KEEP" end'
          gh api "repos/$REPO/branches" --paginate --jq '.[].name' | while read -r b; do
            case "$b" in
              main|release/*|cla-signatures) continue ;;
            esac
            # --head matches the branch name in forks too: only this repository's
            # pull requests say anything about this repository's branch. One
            # branch may head several (into main and into a release branch):
            # it goes only when every one of them was closed without a merge.
            pr=$(gh pr list -R "$REPO" --head "$b" --state all --limit 100 \
              --json state,closedAt,isCrossRepository --jq "$verdict")
            case "$pr" in
              "CLOSED "*)
                closed=${pr#CLOSED }
                if [ "$closed" \< "$week_ago" ]; then
                  gh api -X DELETE "repos/$REPO/git/refs/heads/$b"
                  echo "deleted $b (last pull request closed $closed)" >> "$GITHUB_STEP_SUMMARY"
                fi ;;
              NONE)
                echo "no pull request: $b" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          done
