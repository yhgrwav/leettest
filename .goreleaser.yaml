# Release build: binaries for the tag, pushed by .github/workflows/release.yml.
version: 2

# Otherwise taken from the git remote: a clone under another name ships
# grpc-loadgen_*.tar.gz.
project_name: leettest

builds:
  - id: leettest
    main: ./cmd/leettest
    binary: leettest
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# One SPDX JSON SBOM per archive, next to it: leettest_..._linux_amd64.tar.gz.sbom.json.
# Needs syft on PATH (release.yml installs it).
sboms:
  - artifacts: archive

# Keyless: cosign signs checksums.txt with the workflow's OIDC identity, no key
# or secret exists. The bundle (signature, certificate, transparency-log entry)
# is one file, checksums.txt.sigstore.json; the archives are covered through
# the hashes inside checksums.txt. Needs cosign on PATH and id-token: write.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# A tag with a suffix (v0.1.0-rc.1) is a pre-release; the default would ship
# it as the latest release.
#
# The page body is the hand-written docs/release-notes/vX.Y.Z.md that
# release.yml passes with --release-notes. Do not set changelog.disable: the
# pipe that reads that file is the changelog pipe, so the body comes out empty.
release:
  prerelease: auto
