version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: indent-error-flow
        - name: var-naming
    gosec:
      excludes:
        # G304: every file path the CLI opens (config, dataset, proto, report)
        # is the user's own argument, by design.
        - G304
        # G703: the same finding, found by taint tracking from the config path.
        - G703
        # G404: math/rand shuffles a dataset and drives the fake sender; none
        # of it is a secret.
        - G404
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
      settings:
        # engine.Call crossed the default 128 bytes with Scenario and Next.
        rangeValCopy:
          sizeThreshold: 256

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - prealloc
      # Test code does not ship: file modes, subprocesses and conversions in
      # tests are not a risk to a user.
      - path: _test\.go
        linters:
          - gosec
      # The dev tools under test/ (measurement, stand, stress planning) run on
      # the maintainer's machine and in CI, never on a user's.
      - path: ^test/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yhgrwav/leettest

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
